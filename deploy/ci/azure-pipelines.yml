trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  CONTAINER_REGISTRY: $(CONTAINER_REGISTRY)
  CONTAINER_REGISTRY_USERNAME: $(CONTAINER_REGISTRY_USERNAME)
  # CONTAINER_REGISTRY_PASSWORD is set as a pipeline secret variable

stages:
  - stage: BuildTest
    displayName: Build & Test
    jobs:
      - job: Rust
        displayName: Rust Build & Test
        steps:
          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.88
              source $HOME/.cargo/env
              cargo build --workspace
              cargo test --workspace
              cargo run --manifest-path scripts/validator-rs/Cargo.toml -- run-all
            displayName: Build & test all Rust crates

      - job: Security
        displayName: Secret Scan
        steps:
          - script: |
              sudo apt-get update && sudo apt-get install -y ripgrep
            displayName: Install ripgrep
          - script: |
              ./scripts/no-secret-scan.sh
            displayName: Run secret scan

      - job: Lint
        displayName: Lint & Clippy
        steps:
          - script: |
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain 1.88
              source $HOME/.cargo/env
              rustup component add rustfmt clippy
              cargo fmt --check --all
              cargo clippy --workspace -- -D warnings
            displayName: Run lint and clippy

  - stage: BuildImages
    displayName: Build Images
    dependsOn: BuildTest
    condition: succeeded()
    jobs:
      - job: BuildApi
        displayName: Build ryuki-api image
        steps:
          - script: |
              docker build -t ryuki/platform-api:ci -f sources/ryuki-api/Dockerfile .
            displayName: Build ryuki-api Docker image

      - job: BuildPortal
        displayName: Build portal-ui image
        steps:
          - script: |
              docker build -t ryuki/portal-ui:ci -f portal/portal-ui/Dockerfile .
            displayName: Build portal-ui Docker image

  - stage: PushImages
    displayName: Push Images
    dependsOn: BuildImages
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Push
        displayName: Push to container registry
        steps:
          - script: |
              echo "$(CONTAINER_REGISTRY_PASSWORD)" | docker login "$(CONTAINER_REGISTRY)" -u "$(CONTAINER_REGISTRY_USERNAME)" --password-stdin
              docker tag ryuki/platform-api:ci "$(CONTAINER_REGISTRY)/ryuki/platform-api:ci"
              docker tag ryuki/portal-ui:ci "$(CONTAINER_REGISTRY)/ryuki/portal-ui:ci"
              docker push "$(CONTAINER_REGISTRY)/ryuki/platform-api:ci"
              docker push "$(CONTAINER_REGISTRY)/ryuki/portal-ui:ci"
            displayName: Login, tag, and push images
