name: ryuki-infrastructure-platform

services:
  platform-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ryuki
      POSTGRES_PASSWORD: "ryuki_dev" # secret-scan-allow: local dev-only default, not a production secret
      POSTGRES_DB: ryuki_platform
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ryuki"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ryuki-net

  platform-api:
    build:
      context: ../..
      dockerfile: sources/ryuki-api/Dockerfile
    image: ryuki/platform-api:rust-dev
    environment:
      RYUKI_DATABASE_URL: postgres://ryuki:ryuki_dev@platform-db:5432/ryuki_platform
      RYUKI_DATABASE__REQUIRED: "true"
      RYUKI_MIGRATION_MODE: local-auto
      RYUKI_SERVER__BIND_ADDRESS: 0.0.0.0:8080
      RYUKI_PLATFORM_URL: http://localhost:18080
      # Select an active, content-addressed admission profile explicitly. The
      # image supplies the immutable contract root; no implementation-only
      # repository fixture is selected implicitly.
      RYUKI_SECURITY_CONTRACT_ROOT: /app/security-contract
      RYUKI_DEPLOYMENT_SECURITY_PROFILE_PATH: "${RYUKI_DEPLOYMENT_SECURITY_PROFILE_PATH:?required}"
      RYUKI_DEPLOYMENT_SECURITY_PROFILE_DIGEST: "${RYUKI_DEPLOYMENT_SECURITY_PROFILE_DIGEST:?required}"
      RYUKI_CONFORMANCE_TRUST_ROOT_REGISTRY_PATH: "${RYUKI_CONFORMANCE_TRUST_ROOT_REGISTRY_PATH:?required}"
      RYUKI_CONFORMANCE_TRUST_ROOT_REGISTRY_DIGEST: "${RYUKI_CONFORMANCE_TRUST_ROOT_REGISTRY_DIGEST:?required}"
      RYUKI_EXPECTED_DEPLOYMENT_ID: "${RYUKI_EXPECTED_DEPLOYMENT_ID:?required}"
      RYUKI_SECURITY_PROFILE: "${RYUKI_SECURITY_PROFILE:?required}"
      # The bridge listener is non-loopback, so credential-free mock/static
      # authority is rejected. Compose reads the root .env for interpolation,
      # but forwards only this reviewed local-auth/session contract.
      RYUKI_AUTH_MODE: local
      RYUKI_LOCAL_AUTH__USERS: "${RYUKI_LOCAL_AUTH__USERS:?required}"
      RYUKI_LOCAL_AUTH__SITE_AUTHORITY: "${RYUKI_LOCAL_AUTH__SITE_AUTHORITY:?required}"
      RYUKI_LOCAL_AUTH__SITE_SCOPE: "${RYUKI_LOCAL_AUTH__SITE_SCOPE:-}"
      RYUKI_LOCAL_AUTH__ENVIRONMENT_AUTHORITY: "${RYUKI_LOCAL_AUTH__ENVIRONMENT_AUTHORITY:?required}"
      RYUKI_LOCAL_AUTH__ENVIRONMENT_SCOPE: "${RYUKI_LOCAL_AUTH__ENVIRONMENT_SCOPE:-}"
      RYUKI_SESSION__CREDENTIAL_HMAC_KEY: "${RYUKI_SESSION__CREDENTIAL_HMAC_KEY:?required}"
      RYUKI_SESSION__COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      platform-db:
        condition: service_healthy
    networks:
      - ryuki-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  portal-ui:
    build:
      context: ../..
      dockerfile: portal/portal-ui/Dockerfile
    image: ryuki/portal-ui:rust-dev
    environment:
      RYUKI_PORTAL_PUBLIC_ORIGIN: http://127.0.0.1:18000
      RYUKI_PORTAL_ALLOW_INSECURE_LOOPBACK: "true"
    ports:
      - "127.0.0.1:18000:8080"
    depends_on:
      platform-api:
        condition: service_healthy
    networks:
      - ryuki-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:

networks:
  ryuki-net:
    driver: bridge
