name: ryuki-infrastructure-platform

services:
  platform-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ryuki
      POSTGRES_PASSWORD: "ryuki_dev" # secret-scan-allow: local dev-only default, not a production secret
      POSTGRES_DB: ryuki_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ryuki"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - ryuki-net

  platform-api:
    build:
      context: ../..
      dockerfile: sources/ryuki-api/Dockerfile
    image: ryuki/platform-api:rust-dev
    env_file:
      - path: ../../.env
        required: false
    environment:
      RYUKI_DATABASE_URL: postgres://ryuki:ryuki_dev@platform-db:5432/ryuki_platform
      RYUKI_DATABASE__REQUIRED: "true"
      RYUKI_SERVER__BIND_ADDRESS: 0.0.0.0:8080
      RYUKI_PLATFORM_URL: http://localhost:18080
    ports:
      - "18080:8080"
    depends_on:
      platform-db:
        condition: service_healthy
    networks:
      - ryuki-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  portal-ui:
    build:
      context: ../..
      dockerfile: portal/portal-ui/Dockerfile
    image: ryuki/portal-ui:rust-dev
    ports:
      - "18000:8080"
    depends_on:
      platform-api:
        condition: service_healthy
    networks:
      - ryuki-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata:

networks:
  ryuki-net:
    driver: bridge
