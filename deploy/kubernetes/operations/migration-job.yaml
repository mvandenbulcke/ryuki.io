# Operations-only template. Do not add this file to a continuously reconciled
# base or GitOps Application. Production creation is currently disabled: the
# offline validator rejects every `final-render` until an in-cluster admission
# layer fences live ConfigMap identity and consumes one unique attempt, and the
# runner revalidates receipt freshness before database access. Every
# `111111111111` identity below is the first 12 lowercase hex characters of
# the admitted image digest and must be rewritten atomically with that image.
# `RENDER_REQUIRED` is never an admissible final value: the renderer replaces
# every sentinel and changes render-mode to `final-render` only as a diagnostic
# shape. That shape is not execution authority and must not be submitted.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: platform-api-migrations-111111111111-
  namespace: ryuki-platform
  annotations:
    ryuki.io/cutover-contract: migration-cutover-v1
    ryuki.io/release-image: registry.example.invalid/ryuki/platform-api@sha256:1111111111111111111111111111111111111111111111111111111111111111
    ryuki.io/render-contract: migration-final-render-v1
    ryuki.io/render-mode: source-template
    ryuki.io/pin-migration-config-receipt: RENDER_REQUIRED
    ryuki.io/pin-security-admission-receipt: RENDER_REQUIRED
    ryuki.io/pin-production-build-manifest-receipt: RENDER_REQUIRED
    ryuki.io/pin-conformance-trust-checkpoint-receipt: RENDER_REQUIRED
    ryuki.io/pin-deployed-workload-attestation-receipt: RENDER_REQUIRED
    ryuki.io/pin-public-ingress-attestation-receipt: RENDER_REQUIRED
    ryuki.io/pin-postgresql-infrastructure-attestation-receipt: RENDER_REQUIRED
    ryuki.io/pin-first-owner-authority-receipt: RENDER_REQUIRED
    ryuki.io/pin-socket-projection-authority-receipt: RENDER_REQUIRED
    ryuki.io/socket-projection-receipt-digest: RENDER_REQUIRED
    ryuki.io/socket-contract-digest: sha256:369bca5b159d7535a2b3523796ff3632e9e7ca44f9a94b4140cc572163767697
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: platform-api-migrations
    app.kubernetes.io/component: database-migration-runner
    ryuki.io/release-digest-prefix: "111111111111"
spec:
  # Fail safely if this source template is submitted accidentally. Do not clear
  # suspension: no production final render is admissible with the current
  # snapshot-only validator.
  suspend: true
  # A failed or timed-out DDL wave requires operator readback before any new
  # generated Job is created. Kubernetes must never retry the migration writer.
  # The Job duration is capped at 300 seconds. This does not enforce receipt
  # freshness at Pod start or during runtime; that missing gate is why
  # production execution remains disabled.
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 300
  # Deliberately no ttlSecondsAfterFinished: evidence retention/deletion is an
  # explicit release operation, not an automatic recreate loop.
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: ryuki-infrastructure-platform
        app.kubernetes.io/name: platform-api-migrations
        app.kubernetes.io/component: database-migration-runner
        ryuki.io/release-digest-prefix: "111111111111"
    spec:
      serviceAccountName: platform-api-migrator
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      # Project CloudNativePG's public CA and one bounded memory-backed
      # workspace for the owner-only SQLx-to-TLS relay socket. No credential or
      # durable state is written there.
      # Live authority socket volumes are deliberately absent from this source
      # template. The retained `migration-final-render-v1` diagnostic shape adds
      # exactly four reviewed mounts, but is still rejected and never created.
      volumes:
        - name: cnpg-ca
          secret:
            secretName: ryuki-platform-db-ca
            items:
              - key: ca.crt
                path: ca.crt
        - name: postgresql-relay-workspace
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: platform-api-migrations
          # Must remain byte-for-byte identical to the replacement verify-only
          # platform-api image and metadata annotation above.
          image: registry.example.invalid/ryuki/platform-api@sha256:1111111111111111111111111111111111111111111111111111111111111111
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: cnpg-ca
              mountPath: /var/run/secrets/ryuki/cnpg
              readOnly: true
            - name: postgresql-relay-workspace
              mountPath: /run/ryuki-postgresql-relay
              readOnly: false
          envFrom:
            # Source-template placeholder only. The diagnostic final-render
            # shape rewrites this to
            # platform-api-migration-config-<release-digest-prefix>, requires
            # immutable API readback, and binds it as one of nine pin receipts.
            - configMapRef:
                name: platform-api-migration-config
          # The digest-scoped VaultDynamicSecret and independently governed
          # admission/attestation ConfigMaps are imported key-by-key; none can
          # widen configuration. The PostgreSQL authority owns the pre-
          # provisioned Unix socket named by its ConfigMap. No database
          # credential or private signing material belongs in either ConfigMap.
          # A future independently governed in-cluster admission layer must
          # project every pinned live socket and fence it through Pod
          # materialization before this container starts. This template does
          # not permit an implicit hostPath or an in-image authority fallback.
          env:
            - name: RYUKI_MIGRATION_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ryuki-platform-api-migrator-db-111111111111
                  key: RYUKI_MIGRATION_DATABASE_URL
            - name: RYUKI_SECURITY_CONTRACT_ROOT
              valueFrom:
                configMapKeyRef:
                  name: platform-security-admission-config-111111111111
                  key: RYUKI_SECURITY_CONTRACT_ROOT
            - name: RYUKI_DEPLOYMENT_SECURITY_PROFILE_PATH
              valueFrom:
                configMapKeyRef:
                  name: platform-security-admission-config-111111111111
                  key: RYUKI_DEPLOYMENT_SECURITY_PROFILE_PATH
            - name: RYUKI_DEPLOYMENT_SECURITY_PROFILE_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: platform-security-admission-config-111111111111
                  key: RYUKI_DEPLOYMENT_SECURITY_PROFILE_DIGEST
            - name: RYUKI_CONFORMANCE_TRUST_ROOT_REGISTRY_PATH
              valueFrom:
                configMapKeyRef:
                  name: platform-security-admission-config-111111111111
                  key: RYUKI_CONFORMANCE_TRUST_ROOT_REGISTRY_PATH
            - name: RYUKI_CONFORMANCE_TRUST_ROOT_REGISTRY_DIGEST
              valueFrom:
                configMapKeyRef:
