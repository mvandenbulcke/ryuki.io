            - name: RYUKI_SECURITY_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: platform-security-admission-config-111111111111
                  key: RYUKI_SECURITY_PROFILE
            - name: RYUKI_PRODUCTION_BUILD_MANIFEST_PATH
              valueFrom:
                configMapKeyRef:
                  name: platform-production-build-manifest-pins-111111111111
                  key: RYUKI_PRODUCTION_BUILD_MANIFEST_PATH
            - name: RYUKI_PRODUCTION_BUILD_MANIFEST_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: platform-production-build-manifest-pins-111111111111
                  key: RYUKI_PRODUCTION_BUILD_MANIFEST_DIGEST
            - name: RYUKI_CONFORMANCE_TRUST_CHECKPOINT_SOCKET
              valueFrom:
                configMapKeyRef:
                  name: platform-conformance-trust-checkpoint-pins-111111111111
                  key: RYUKI_CONFORMANCE_TRUST_CHECKPOINT_SOCKET
            - name: RYUKI_CONFORMANCE_TRUST_CHECKPOINT_AUTHORITY_ID
