# Operations-only JIT credential template. Do not add this file to a
# continuously reconciled base or GitOps Application. Create both resources
# only after the migration-cutover contract proves all writers and database
# sessions drained; delete both after independent role/ledger readback. Every
# `111111111111` identity below is derived from the first 12 lowercase hex
# characters of the admitted platform-api image digest.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ryuki-api-db-migrator-vault-auth-111111111111
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: platform-api-migrations
    ryuki.io/release-digest-prefix: "111111111111"
spec:
  vaultConnectionRef: ryuki-platform-vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # The external Vault auth role and policy are digest-scoped release inputs.
    # They may request only database/creds/ryuki-schema-migrator-111111111111.
    role: ryuki-api-db-migrator-111111111111
    serviceAccount: vault-api-db-migrator
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: ryuki-platform-api-migrator-db-111111111111
  namespace: ryuki-platform
  annotations:
    ryuki.io/postgres-host: ryuki-platform-db-rw.ryuki-platform.svc:5432
    ryuki.io/cutover-contract: migration-cutover-v1
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: platform-api-migrations
    ryuki.io/release-digest-prefix: "111111111111"
spec:
  vaultAuthRef: ryuki-api-db-migrator-vault-auth-111111111111
  mount: database
  path: creds/ryuki-schema-migrator-111111111111
  renewalPercent: 67
  revoke: true
  allowStaticCreds: false
  destination:
    name: ryuki-platform-api-migrator-db-111111111111
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        RYUKI_MIGRATION_DATABASE_URL:
          text: |-
            {{- $username := toString (get .Secrets "username") -}}
            {{- $password := toString (get .Secrets "password") -}}
            {{- if not (regexMatch "^[A-Za-z0-9._~-]+$" $username) -}}
            {{- fail "Vault database username is not URL-safe" -}}
            {{- end -}}
            {{- if not (regexMatch "^[A-Za-z0-9._~-]+$" $password) -}}
            {{- fail "Vault database password is not URL-safe" -}}
            {{- end -}}
            {{- printf "postgresql://%s:%s@%s/ryuki_platform?sslmode=verify-full&sslrootcert=/var/run/secrets/ryuki/cnpg/ca.crt" $username $password (get .Annotations "ryuki.io/postgres-host") -}}
  # No rolloutRestartTargets: this lease belongs to exactly one generated Job.
  # `revoke: true` makes deletion an explicit credential-revocation gate.
