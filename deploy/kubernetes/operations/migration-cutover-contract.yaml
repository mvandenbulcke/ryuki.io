# Static release-orchestrator input, not a Kubernetes resource. The release
# system may validate this file against a frozen snapshot, but production
# execution is deliberately disabled. This validator is not an in-cluster
# admission controller and cannot authorize Job creation. The contract carries
# no credential value and is never applied with
# kubectl/GitOps. Every digest-scoped name, label, Vault role, database role,
# and `digestPrefix` is derived from the first 12 lowercase hex characters of
# `release.image`; a render must never replace these independently. This source
# template is not executable. The retained final-render shape is diagnostic
# only: every final render is rejected until an independently anchored
# in-cluster admission layer fences live object identity and consumes a unique
# attempt, and the runtime revalidates receipt freshness before database access.
