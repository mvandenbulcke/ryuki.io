# Static CloudNativePG Cluster skeleton — no live deployment.
# This manifest defines the minimum viable contract for the HA PostgreSQL
# control-plane database. Credentials live in Vault and are injected at
# deploy-time by the Vault Secrets Operator. Do not add passwords,
# connection strings, or credential material here.
#
# Prerequisites:
#   - CloudNativePG operator installed in the cluster
#   - Vault Secrets Operator configured for secret synchronization
#   - vSphere CSI driver providing the storage class

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ryuki-platform-db
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  # Three-instance HA topology per build sheet decision
  instances: 3

  # Anti-affinity keeps pods on separate nodes
  affinity:
    podAntiAffinityType: required

  # Placeholder database name — real name resolved at deploy-time
  bootstrap:
    initdb:
      database: ryuki_platform
      owner: ryuki_platform
      secret:
        name: ryuki-platform-db-superuser

  # vSphere CSI-backed persistent storage
  storage:
    size: 10Gi
    storageClass: vsphere-csi

  # Separate WAL volume on fast storage
  walStorage:
    size: 5Gi
    storageClass: vsphere-csi

  # External secret reference for Vault-managed credentials
  managed:
    roles:
      - name: ryuki-platform-app
        ensure: managed
        passwordSecret:
          name: ryuki-platform-db-app-user

  # Maintenance and upgrade posture — placeholder, reviewed per plan
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  # Backup configuration — placeholder, real Barman object store resolved at deploy-time.
  # The recurring base backup that uses this target is defined in
  # scheduled-backup.yaml (CNPG ScheduledBackup). WAL archiving below runs
  # continuously and is what enables point-in-time recovery (PITR).
  backup:
    # Single Barman retention window for base backups + archived WAL. 30d
    # matches the daily=30 retention floor from RYUKI_RETENTION__DAILY_BACKUPS
    # (deploy/kubernetes/base/configmap.yaml) and bounds the PITR window.
    # TODO(retention-tiers): weekly/monthly/yearly GFS tiers are object-store
    # lifecycle rules on the bucket, not this single window.
    retentionPolicy: "30d"
    barmanObjectStore:
      # TODO(object-store): replace with the real bucket and S3-compatible
      # endpoint at deploy time. These placeholders are syntactically valid but
      # non-functional; do NOT commit real bucket names or endpoints here.
      destinationPath: s3://placeholder-bucket/
      endpointURL: https://placeholder-s3-endpoint.invalid
      s3Credentials:
        # CNPG's barmanObjectStore.s3Credentials fields are `accessKeyId` /
        # `secretAccessKey` (each a {name,key} secret reference) — NOT
        # `accessKeyIdSecret` / `secretAccessKeySecret`. The wrong names fail
        # `kubectl apply` against the CNPG CRD with a strict-decoding error
        # ("unknown field ...accessKeyIdSecret"); verified end-to-end against
        # CloudNativePG 1.24.1 (a real backup ran to an S3 object store only with
        # these names).
        accessKeyId:
          name: ryuki-platform-db-backup-s3
          key: access_key_id
        secretAccessKey:
          name: ryuki-platform-db-backup-s3
          key: secret_access_key
      # Continuous WAL archiving — required for PITR. Compression keeps the
      # object store small; maxParallel speeds up archive/restore throughput.
      wal:
        compression: gzip
        maxParallel: 8
      data:
        compression: gzip

  # Monitoring integration — placeholder
  monitoring:
    enablePodMonitor: true

  # Postgres configuration — minimum safe defaults
  postgresql:
    parameters:
      shared_buffers: 256MB
      max_connections: 200
