# Static CloudNativePG Cluster skeleton — no live deployment.
# This manifest defines the minimum viable contract for the HA PostgreSQL
# control-plane database. Credentials live in Vault and are injected at
# deploy-time by the Vault Secrets Operator. Do not add passwords,
# connection strings, or credential material here.
#
# Prerequisites:
#   - CloudNativePG operator installed in the cluster
#   - Vault Secrets Operator configured for secret synchronization
#   - vSphere CSI driver providing the storage class

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ryuki-platform-db
  namespace: ryuki-platform
  annotations:
    # Final certificate evidence must contain this exact DNS SAN. Both runtime
    # and migration clients connect by this name with sslmode=verify-full.
    ryuki.io/required-server-dns-san: ryuki-platform-db-rw.ryuki-platform.svc
    # CloudNativePG's operator-managed CA Secret is projected into clients with
    # an items allowlist that exposes ca.crt only, never ca.key.
    ryuki.io/client-ca-secret: ryuki-platform-db-ca
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  # Three-instance HA topology per build sheet decision
  instances: 3

  # Anti-affinity keeps pods on separate nodes
  affinity:
    podAntiAffinityType: required

  # Placeholder database name — real name resolved at deploy-time
  bootstrap:
    initdb:
      database: ryuki_platform
      owner: ryuki_platform
      secret:
        name: ryuki-platform-db-superuser
      # Stable NOLOGIN group roles are the only database authorities used by
      # short-lived Vault logins. Dynamic sessions must SET ROLE to one of
      # these exact principals; application startup and the migration runner
      # independently verify current_user plus session membership.
      postInitApplicationSQL:
        - |-
          DO $roles$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname = 'ryuki_app_runtime'
            ) THEN
              CREATE ROLE ryuki_app_runtime NOLOGIN NOSUPERUSER NOCREATEDB
                NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
            IF NOT EXISTS (
              SELECT 1 FROM pg_roles WHERE rolname = 'ryuki_schema_migrator'
            ) THEN
              CREATE ROLE ryuki_schema_migrator NOLOGIN NOSUPERUSER NOCREATEDB
                NOCREATEROLE NOREPLICATION NOBYPASSRLS;
            END IF;
          END
          $roles$;
        - ALTER ROLE ryuki_app_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOREPLICATION NOBYPASSRLS CONNECTION LIMIT -1 PASSWORD NULL
        - ALTER ROLE ryuki_schema_migrator NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOREPLICATION NOBYPASSRLS CONNECTION LIMIT -1 PASSWORD NULL
        # Scope migration ownership to the application schema. The durable
        # bootstrap role remains the NOLOGIN database owner, so the migration
        # role can alter application objects without acquiring database-wide
        # CREATE/TEMP or ownership authority.
        - ALTER SCHEMA public OWNER TO ryuki_schema_migrator
        - ALTER ROLE ryuki_platform NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOREPLICATION NOBYPASSRLS CONNECTION LIMIT -1 PASSWORD NULL
        # Remove PostgreSQL's default PUBLIC CONNECT/TEMP authority from every
        # existing connectable database, including template1. Strict startup
        # rejects a later database until its defaults are similarly closed.
        - |-
          DO $databases$
          DECLARE
            target_database name;
          BEGIN
            FOR target_database IN
              SELECT datname
              FROM pg_database
              WHERE datallowconn
            LOOP
              EXECUTE format(
                'REVOKE ALL PRIVILEGES ON DATABASE %I FROM PUBLIC, ryuki_app_runtime, ryuki_schema_migrator',
                target_database
              );
            END LOOP;
          END
          $databases$;
        - GRANT CONNECT ON DATABASE ryuki_platform TO ryuki_app_runtime, ryuki_schema_migrator
        - REVOKE ALL ON SCHEMA public FROM PUBLIC
        - GRANT USAGE ON SCHEMA public TO ryuki_app_runtime, ryuki_schema_migrator
        - GRANT CREATE ON SCHEMA public TO ryuki_schema_migrator
        - |-
          ALTER DEFAULT PRIVILEGES FOR ROLE ryuki_schema_migrator
          IN SCHEMA public REVOKE ALL PRIVILEGES ON TABLES
          FROM PUBLIC, ryuki_app_runtime
        - |-
          ALTER DEFAULT PRIVILEGES FOR ROLE ryuki_schema_migrator
          IN SCHEMA public REVOKE ALL PRIVILEGES ON SEQUENCES
          FROM PUBLIC, ryuki_app_runtime
        - |-
          ALTER DEFAULT PRIVILEGES FOR ROLE ryuki_schema_migrator
          IN SCHEMA public REVOKE ALL PRIVILEGES ON FUNCTIONS
          FROM PUBLIC, ryuki_app_runtime

  # vSphere CSI-backed persistent storage
  storage:
    size: 10Gi
    storageClass: vsphere-csi

  # Separate WAL volume on fast storage
  walStorage:
    size: 5Gi
    storageClass: vsphere-csi

  # External secret reference for Vault-managed credentials
  managed:
    roles:
      - name: ryuki_app_runtime
        ensure: present
        login: false
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
        disablePassword: true
      - name: ryuki_schema_migrator
        ensure: present
        login: false
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        replication: false
        bypassrls: false
        disablePassword: true

  # Maintenance and upgrade posture — placeholder, reviewed per plan
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  # Backup configuration — placeholder, real Barman object store resolved at deploy-time.
  # The recurring base backup that uses this target is defined in
  # scheduled-backup.yaml (CNPG ScheduledBackup). WAL archiving below runs
  # continuously and is what enables point-in-time recovery (PITR).
  backup:
    # Single Barman retention window for base backups + archived WAL. 30d
    # matches the daily=30 retention floor from RYUKI_RETENTION__DAILY_BACKUPS
    # (deploy/kubernetes/base/configmap.yaml) and bounds the PITR window.
    # TODO(retention-tiers): weekly/monthly/yearly GFS tiers are object-store
    # lifecycle rules on the bucket, not this single window.
    retentionPolicy: "30d"
    barmanObjectStore:
      # TODO(object-store): replace with the real bucket and S3-compatible
      # endpoint at deploy time. These placeholders are syntactically valid but
      # non-functional; do NOT commit real bucket names or endpoints here.
      destinationPath: s3://placeholder-bucket/
      endpointURL: https://placeholder-s3-endpoint.invalid
      s3Credentials:
        # CNPG's barmanObjectStore.s3Credentials fields are `accessKeyId` /
        # `secretAccessKey` (each a {name,key} secret reference) — NOT
        # `accessKeyIdSecret` / `secretAccessKeySecret`. The wrong names fail
        # `kubectl apply` against the CNPG CRD with a strict-decoding error
        # ("unknown field ...accessKeyIdSecret"); verified end-to-end against
        # CloudNativePG 1.24.1 (a real backup ran to an S3 object store only with
        # these names).
        accessKeyId:
          name: ryuki-platform-db-backup-s3
          key: access_key_id
        secretAccessKey:
          name: ryuki-platform-db-backup-s3
          key: secret_access_key
      # Continuous WAL archiving — required for PITR. Compression keeps the
      # object store small; maxParallel speeds up archive/restore throughput.
      wal:
        compression: gzip
        maxParallel: 8
      data:
        compression: gzip

  # Monitoring integration — placeholder
  monitoring:
    enablePodMonitor: true

  # Postgres configuration — minimum safe defaults
  postgresql:
    parameters:
      shared_buffers: 256MB
      max_connections: 200
