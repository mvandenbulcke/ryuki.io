apiVersion: v1
kind: ServiceAccount
metadata:
  name: portal-ui
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: portal-ui
automountServiceAccountToken: false
---
# Dedicated TokenRequest identities for secret materialization. These accounts
# are not workload identities for platform-api and never auto-mount a token.
# Each external Vault role/policy must be independently reviewed and limited to
# only the matching secret family before this skeleton is adopted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-db-owner
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/component: secret-materializer
    ryuki.io/secret-family: database-owner
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-db-backup
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/component: secret-materializer
    ryuki.io/secret-family: database-backup
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-api-db
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/component: secret-materializer
    ryuki.io/secret-family: api-database
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-api-db-migrator
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/component: secret-materializer
    ryuki.io/secret-family: api-database-migrator
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: platform-api
automountServiceAccountToken: false
---
# One-shot workload identity. It is distinct from both the long-running API
# and the TokenRequest identity VSO uses to materialize the migrator Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-api-migrator
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: platform-api-migrations
automountServiceAccountToken: false
