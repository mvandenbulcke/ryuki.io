apiVersion: apps/v1
kind: Deployment
metadata:
  name: portal-ui
  namespace: ryuki-platform
  labels: &portal-ui-labels
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: portal-ui
spec:
  replicas: 1
  selector:
    matchLabels: *portal-ui-labels
  template:
    metadata:
      labels: *portal-ui-labels
    spec:
      serviceAccountName: portal-ui
      containers:
        - name: portal-ui
          image: ryuki/portal-ui:rust-dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: portal-ui-config
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  namespace: ryuki-platform
  labels: &platform-api-labels
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/component: platform-api-rust
spec:
  replicas: 1
  selector:
    matchLabels: *platform-api-labels
  template:
    metadata:
      labels: *platform-api-labels
    spec:
      serviceAccountName: platform-api
      containers:
        - name: platform-api
          image: ryuki/platform-api:rust-dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: platform-api-config
            # RYUKI_DATABASE_URL — materialized from Vault by the Vault Secrets
            # Operator (deploy/kubernetes/vault/vso-secrets.yaml). For clusters
            # without VSO, create this Secret out-of-band (see base README).
            - secretRef:
                name: ryuki-platform-api-db
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
