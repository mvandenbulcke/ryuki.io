apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: default-deny-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-portal-ui
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: portal-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ryuki-infrastructure-platform
      app.kubernetes.io/name: portal-ui
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-to-platform-api
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: platform-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ryuki-infrastructure-platform
      app.kubernetes.io/name: platform-api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ryuki-infrastructure-platform
              app.kubernetes.io/name: portal-ui
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-portal-ui-egress-to-platform-api
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: portal-ui
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: ryuki-infrastructure-platform
      app.kubernetes.io/name: portal-ui
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: ryuki-infrastructure-platform
              app.kubernetes.io/name: platform-api
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-to-kube-dns
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: kube-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
