# Non-secret runtime configuration only. RYUKI_DATABASE_URL and all other
# credential-bearing values are delivered as Kubernetes Secrets by the Vault
# Secrets Operator (see deploy/kubernetes/vault/vso-secrets.yaml). Do not add
# passwords, connection strings, or credential material here.

apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-api-config
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: platform-api
data:
  RYUKI_SERVER__BIND_ADDRESS: "0.0.0.0:8080"
  # Deliberately no default authentication mode. Startup rejects the
  # credential-free mock/static modes on this non-loopback listener; a
  # deployment overlay must select and fully configure an admitted
  # authenticator before the API can become ready.
  # Placeholder external URL — real host resolved by the deployment-time overlay.
  RYUKI_PLATFORM_URL: "https://platform.example.invalid"
  # Fail hard when the database is unreachable: crash-loop instead of silently
  # serving from in-memory stores. Required posture for the K8s topology.
  RYUKI_DATABASE__REQUIRED: "true"
  # The long-running API has read-only migration-ledger authority. Schema
  # mutation is owned exclusively by the one-shot platform-api-migrations Job.
  RYUKI_MIGRATION_MODE: "verify-only"
  # Vault issues a short-lived login that must SET ROLE to this non-login
  # application group. Startup verifies current_user, session membership,
  # DML coverage, read-only migration-ledger access, and absence of DDL.
  RYUKI_DATABASE_EXPECTED_ROLE: "ryuki_app_runtime"
  RYUKI_DATABASE_FORBIDDEN_ROLE: "ryuki_schema_migrator"
  # Exact, value-free retained Vault runtime binding. The projected JWT and CA
  # paths below are fixed by deployments.yaml; no token or secret value belongs
  # in this ConfigMap. The direct API identity is intentionally distinct from
  # every Vault Secrets Operator materializer identity.
  RYUKI_SECRET_PROVIDER_RUNTIME__PROVIDER_ID: "provider:hashicorp-vault-primary"
  RYUKI_SECRET_PROVIDER_RUNTIME__CONFIGURATION_VERSION: "1"
  RYUKI_SECRET_PROVIDER_RUNTIME__API_FLAVOR: "hashicorp-vault-v1"
  RYUKI_SECRET_PROVIDER_RUNTIME__ENDPOINT: "https://vault.vault.svc:8200"
  RYUKI_SECRET_PROVIDER_RUNTIME__CA_BUNDLE_PATH: "/var/run/secrets/ryuki/vault-tls/ca.crt"
  RYUKI_SECRET_PROVIDER_RUNTIME__KUBERNETES_AUTH_MOUNT: "kubernetes"
  RYUKI_SECRET_PROVIDER_RUNTIME__KUBERNETES_ROLE: "ryuki-platform-api"
  RYUKI_SECRET_PROVIDER_RUNTIME__KUBERNETES_AUDIENCE: "vault"
  RYUKI_SECRET_PROVIDER_RUNTIME__PROJECTED_TOKEN_PATH: "/var/run/secrets/ryuki/vault-auth/token"
  RYUKI_SECRET_PROVIDER_RUNTIME__EXPECTED_SERVICE_ACCOUNT_NAMESPACE: "ryuki-platform"
  RYUKI_SECRET_PROVIDER_RUNTIME__EXPECTED_SERVICE_ACCOUNT_NAME: "platform-api"
  RYUKI_SECRET_PROVIDER_RUNTIME__EXPECTED_TOKEN_POLICY: "ryuki-platform-api-runtime"
  # Non-secret pointer to the dedicated, operator-created fingerprint keyring.
  # Key material is projected read-only by deployments.yaml and never belongs
  # in this ConfigMap or a process environment variable.
  RYUKI_SECRET_REFERENCE_FINGERPRINT_KEYRING_PATH: "/var/run/secrets/ryuki/secret-reference-fingerprint/keyring"
  # Backup retention knobs (days/weeks/months/years).
  RYUKI_RETENTION__DAILY_BACKUPS: "30"
  RYUKI_RETENTION__WEEKLY_BACKUPS: "12"
  RYUKI_RETENTION__MONTHLY_BACKUPS: "12"
  RYUKI_RETENTION__YEARLY_BACKUPS: "7"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-api-migration-config
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: platform-api-migrations
data:
  # Reviewed offline-DDL envelope. Both bounds remain inside the 300-second
  # PostgreSQL infrastructure proof lifetime so DDL cannot outlive admission.
  # The runner validates them before opening its dedicated connection and exits
  # after exact postflight readback.
  RYUKI_MIGRATION_MODE: "apply-only"
  RYUKI_MIGRATION_STATEMENT_TIMEOUT_SECS: "180"
  RYUKI_MIGRATION_LOCK_TIMEOUT_SECS: "30"
  # The dynamic login must SET ROLE to the stable schema owner so every release
  # can alter objects created by earlier short-lived Vault credentials.
  RYUKI_MIGRATION_EXPECTED_ROLE: "ryuki_schema_migrator"
  # The apply-only runner grants application DML after each migration wave,
  # then revokes every write/DDL privilege on _sqlx_migrations.
  RYUKI_APPLICATION_DATABASE_ROLE: "ryuki_app_runtime"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portal-ui-config
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: portal-ui
data:
  # Safe, non-resolving HTTPS placeholders. Every deployment overlay MUST
  # replace both with its externally reachable same-origin ingress address.
  RYUKI_API_URL: "https://platform.example.invalid"
  RYUKI_PORTAL_PUBLIC_ORIGIN: "https://platform.example.invalid"
  # Kubernetes is an externally reachable workload, so it must use the live
  # provider path. The non-resolving origin keeps the base template fail-closed
  # until an overlay supplies the reviewed same-origin ingress address.
  RYUKI_PORTAL_EXECUTION_MODE: "live-provider"
  # Override the loopback-development image default explicitly in Kubernetes.
  RYUKI_PORTAL_ALLOW_INSECURE_LOOPBACK: "false"
