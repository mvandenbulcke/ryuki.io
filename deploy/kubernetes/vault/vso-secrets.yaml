# Vault Secrets Operator skeleton — no live deployment.
# These resources define how the secrets referenced by the CNPG cluster
# (deploy/kubernetes/cloudnativepg/cnpg-cluster.yaml) and the platform-api
# Deployment are materialized from Vault. Secret VALUES live only in Vault;
# this file carries names and mount paths only. Do not add passwords,
# connection strings, tokens, or credential material here.
#
# Prerequisites:
#   - Vault Secrets Operator installed in the cluster
#   - Vault Kubernetes auth method enabled with independently scoped roles
#     bound to the dedicated materializer ServiceAccounts in
#     deploy/kubernetes/base/serviceaccounts.yaml
#   - KV v2 mount populated out-of-band per the bootstrap runbook
#
# Placeholder address and paths — real values resolved by the deployment-time
# overlay, consistent with catalog/vault-secret-delivery-contract.yaml
# (all mutation/apply flags remain false; these are static artifacts).

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: ryuki-platform-vault
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  # Placeholder in-cluster Vault service address — overlay-resolved.
  address: https://vault.vault.svc:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ryuki-db-owner-vault-auth
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  vaultConnectionRef: ryuki-platform-vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # External policy must read only the database-owner/bootstrap family.
    role: ryuki-db-owner
    serviceAccount: vault-db-owner
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ryuki-db-backup-vault-auth
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  vaultConnectionRef: ryuki-platform-vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # External policy must read only the backup-object-store family.
    role: ryuki-db-backup
    serviceAccount: vault-db-backup
    audiences:
      - vault
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ryuki-api-db-vault-auth
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  vaultConnectionRef: ryuki-platform-vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # External policy must read only the API runtime database family.
    role: ryuki-api-db
    serviceAccount: vault-api-db
    audiences:
      - vault
---
# CNPG bootstrap.initdb owner credential (kubernetes.io/basic-auth: username/
# password) — the application database owner, not the cluster superuser; the
# secret name is fixed by the existing cnpg-cluster.yaml reference.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryuki-platform-db-superuser
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  vaultAuthRef: ryuki-db-owner-vault-auth
  type: kv-v2
  mount: secret
  path: ryuki-platform/db/superuser
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    name: ryuki-platform-db-superuser
    create: true
    type: kubernetes.io/basic-auth
---
# Barman object-store credential for CNPG backups (keys: access_key_id,
# secret_access_key — names matched by cnpg-cluster.yaml s3Credentials refs).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryuki-platform-db-backup-s3
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  vaultAuthRef: ryuki-db-backup-vault-auth
  type: kv-v2
  mount: secret
  path: ryuki-platform/db/backup-s3
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    name: ryuki-platform-db-backup-s3
    create: true
    type: Opaque
---
# Platform API database connection. Vault's database engine creates a
# short-lived NOINHERIT login which has only SET membership in the stable
# ryuki_app_runtime NOLOGIN role. The transformation excludes the raw username
# and password and emits exactly the one URL key imported by the Deployment.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultDynamicSecret
metadata:
  name: ryuki-platform-api-db
  namespace: ryuki-platform
  annotations:
    ryuki.io/postgres-host: ryuki-platform-db-rw.ryuki-platform.svc:5432
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: platform-api
spec:
  vaultAuthRef: ryuki-api-db-vault-auth
  mount: database
  path: creds/ryuki-app-runtime
  renewalPercent: 67
  revoke: true
  allowStaticCreds: false
  destination:
    name: ryuki-platform-api-db
    create: true
    type: Opaque
    transformation:
      excludeRaw: true
      excludes:
        - .*
      templates:
        RYUKI_DATABASE_URL:
          text: |-
            {{- $username := toString (get .Secrets "username") -}}
            {{- $password := toString (get .Secrets "password") -}}
            {{- if not (regexMatch "^[A-Za-z0-9._~-]+$" $username) -}}
            {{- fail "Vault database username is not URL-safe" -}}
            {{- end -}}
            {{- if not (regexMatch "^[A-Za-z0-9._~-]+$" $password) -}}
            {{- fail "Vault database password is not URL-safe" -}}
            {{- end -}}
            {{- printf "postgresql://%s:%s@%s/ryuki_platform?sslmode=verify-full&sslrootcert=/var/run/secrets/ryuki/cnpg/ca.crt" $username $password (get .Annotations "ryuki.io/postgres-host") -}}
  # The process imports one environment key and cannot observe an in-place
  # Secret update. Restart only this proven consumer. Recreate prevents old/new
  # database writers from overlapping during credential rotation.
  rolloutRestartTargets:
    - kind: Deployment
      name: platform-api

# The migration VaultAuth and VaultDynamicSecret are deliberately absent here.
# They live in deploy/kubernetes/operations/migration-vault-dynamic-secret.yaml
# and are created only after the release orchestrator proves every writer and
# non-operator database session drained. Deleting that digest-scoped resource
# revokes its lease before a matching verify-only API is started.
