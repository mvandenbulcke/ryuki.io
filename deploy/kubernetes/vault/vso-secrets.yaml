# Static Vault Secrets Operator skeleton — no live deployment.
# These resources define how the secrets referenced by the CNPG cluster
# (deploy/kubernetes/cloudnativepg/cnpg-cluster.yaml) and the platform-api
# Deployment are materialized from Vault. Secret VALUES live only in Vault;
# this file carries names and mount paths only. Do not add passwords,
# connection strings, tokens, or credential material here.
#
# Prerequisites:
#   - Vault Secrets Operator installed in the cluster
#   - Vault Kubernetes auth method enabled with a role bound to the
#     platform-api ServiceAccount (deploy/kubernetes/base/serviceaccounts.yaml)
#   - KV v2 mount populated out-of-band per the bootstrap runbook
#
# Placeholder address and paths — real values resolved by the deployment-time
# overlay, consistent with catalog/vault-secret-delivery-contract.yaml
# (all mutation/apply flags remain false; these are static artifacts).

apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultConnection
metadata:
  name: ryuki-platform-vault
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  # Placeholder in-cluster Vault service address — overlay-resolved.
  address: https://vault.vault.svc:8200
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: ryuki-platform-vault-auth
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  vaultConnectionRef: ryuki-platform-vault
  method: kubernetes
  mount: kubernetes
  kubernetes:
    # Vault role bound to the existing platform-api ServiceAccount.
    role: ryuki-platform-api
    serviceAccount: platform-api
    audiences:
      - vault
---
# CNPG bootstrap.initdb owner credential (kubernetes.io/basic-auth: username/
# password) — the application database owner, not the cluster superuser; the
# secret name is fixed by the existing cnpg-cluster.yaml reference.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryuki-platform-db-superuser
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  vaultAuthRef: ryuki-platform-vault-auth
  type: kv-v2
  mount: secret
  path: ryuki-platform/db/superuser
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    name: ryuki-platform-db-superuser
    create: true
    type: kubernetes.io/basic-auth
---
# CNPG managed application role credential (kubernetes.io/basic-auth: username/password).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryuki-platform-db-app-user
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  vaultAuthRef: ryuki-platform-vault-auth
  type: kv-v2
  mount: secret
  path: ryuki-platform/db/app-user
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    name: ryuki-platform-db-app-user
    create: true
    type: kubernetes.io/basic-auth
---
# Barman object-store credential for CNPG backups (keys: access_key_id,
# secret_access_key — names matched by cnpg-cluster.yaml s3Credentials refs).
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryuki-platform-db-backup-s3
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
spec:
  vaultAuthRef: ryuki-platform-vault-auth
  type: kv-v2
  mount: secret
  path: ryuki-platform/db/backup-s3
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    name: ryuki-platform-db-backup-s3
    create: true
    type: Opaque
---
# Platform API database connection (key: RYUKI_DATABASE_URL). The Vault value
# is a full postgres:// URL pointing at the CNPG read-write service,
# ryuki-platform-db-rw.ryuki-platform.svc:5432 — stored ready-made in Vault so
# no transformation template is needed. Consumed by the platform-api
# Deployment via envFrom secretRef.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ryuki-platform-api-db
  namespace: ryuki-platform
  labels:
    app.kubernetes.io/part-of: ryuki-infrastructure-platform
    app.kubernetes.io/name: platform-api
spec:
  vaultAuthRef: ryuki-platform-vault-auth
  type: kv-v2
  mount: secret
  path: ryuki-platform/api/db
  refreshAfter: 60s
  hmacSecretData: true
  destination:
    name: ryuki-platform-api-db
    create: true
    type: Opaque
