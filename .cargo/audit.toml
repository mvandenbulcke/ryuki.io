[advisories]
# sqlx records its unused MySQL driver's RSA dependency in the root Cargo.lock
# even though Ryuki enables only PostgreSQL. The companion dependency-audit
# script fails if `rsa` becomes reachable or appears in any other lockfile.
# This ignore is admitted only while the matching, unexpired lifecycle record
# in vulnerability-exceptions.json validates.
ignore = ["RUSTSEC-2023-0071"]
informational_warnings = ["unmaintained", "unsound", "notice"]
