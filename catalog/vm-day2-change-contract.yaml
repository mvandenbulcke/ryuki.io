# VM day-2 change seed data only. Do not add VM names, hostnames, usernames, credentials, tokens, tenant IDs, object IDs, live endpoints, private IPs, raw inventory rows, or provider payloads.
version: 1
status: draft
source: static-seed
changeMode: dry-run-plan
dryRunRequired: true
providerCallsEnabled: false
liveChangeAllowed: false
