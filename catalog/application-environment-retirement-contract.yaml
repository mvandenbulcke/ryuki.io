# Application environment retirement seed data only. Do not add application names, environment names, hostnames, FQDNs, IP addresses, dependency rows, relationship rows, inventory rows, backup rows, monitoring rows, CMDB rows, recipient data, credentials, tokens, tenant IDs, object IDs, private network values, live endpoints, or provider payloads.
version: 1
status: draft
source: static-seed
retirementMode: dry-run-plan
dryRunRequired: true
providerCallsEnabled: false
workerExecutionAllowed: false
retirementExecutionAllowed: false
