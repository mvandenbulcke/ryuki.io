spnChangesAllowed: false
databaseCreationAllowed: false
sqlAgentJobChangesAllowed: false
rawSqlInstanceDataAllowed: false
rawDatabaseDataAllowed: false
rawPathDataAllowed: false
rawBackupRowsAllowed: false
rawProviderPayloadsAllowed: false
principalIdentifiersAllowed: false
hostIdentifiersAllowed: false
listenerIdentifiersAllowed: false
credentialValuesAllowed: false
portValuesAllowed: false
