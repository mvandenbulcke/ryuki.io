# SQL Server deployment seed data only. Do not add SQL instance names, database names, listener names, hostnames, FQDNs, IP addresses, port values, file paths, backup paths, runtime identity names, SPN values, principal IDs, tenant IDs, object IDs, credentials, tokens, raw SQL rows, raw backup rows, raw logs, or provider payloads.
version: 1
status: draft
source: static-seed
deploymentMode: dry-run-plan
dryRunRequired: true
providerCallsEnabled: false
workerExecutionAllowed: false
deploymentExecutionAllowed: false
liveVmwareChangesAllowed: false
liveHyperVChangesAllowed: false
liveProxmoxChangesAllowed: false
liveSqlChangesAllowed: false
liveDirectoryChangesAllowed: false
