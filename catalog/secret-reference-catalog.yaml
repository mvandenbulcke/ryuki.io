# Secret reference seed data only. Do not add secret values, concrete provider paths, credentials, tokens, tenant IDs, object IDs, private keys, live endpoints, or provider payloads.
version: 1
status: draft
primaryProvider: vaultwarden
managementCli: vaultwarden-cli
futureProviders: []
referencePurpose: Runtime references identify where approved secrets are resolved without storing the secret value or deployment-specific path in catalog data.
referenceKinds:
  - adapter-credential
  - worker-credential
  - database-credential
  - object-storage-credential
  - pki-material
  - recovery-material
  - signing-material
requiredReferenceFields:
  - referenceId
  - provider
  - kind
  - scope
  - ownerRole
  - consumerComponent
  - rotationPolicy
  - readinessState
  - evidenceRequirement
readinessStates:
  - missing
  - pending-approval
  - configured
  - rotation-due
  - blocked
allowedConsumers:
  - platform-api
  - platform-worker
  - inventory-sync
  - evidence-service
  - vmware-adapter
  - hyperv-adapter
  - proxmox-adapter
  - veeam-br-adapter
  - veeam-one-adapter
  - zabbix-adapter
  - servicenow-adapter
  - image-factory-controller
  - vaultwarden-cli
rotationPolicies:
  - deployment-managed
  - scheduled-rotation
  - emergency-rotation
  - certificate-renewal
  - manual-break-glass-review
prohibitedFields:
  - value
  - password
  - token
  - clientSecret
  - privateKey
  - tenantId
  - objectId
  - subscriptionId
  - endpoint
  - url
evidenceRequirements:
  - Reference configured state
  - Rotation policy
  - Consumer component
  - Approval decisions
  - Redacted evidence references
rules:
  - id: vaultwarden-primary-provider
    decision: block
    requirement: Runtime references must use Vaultwarden through vaultwarden-cli.
    evidence: Reference configured state
  - id: provider-fallbacks-disabled
    decision: block
    requirement: Secret-reference records must not define legacy or future provider fallbacks.
    evidence: Approval decisions
  - id: no-secret-values-in-reference
    decision: block
    requirement: Reference records must never contain the resolved secret value or raw credential material.
    evidence: Redacted evidence references
  - id: deployment-paths-outside-catalog
    decision: block
    requirement: Concrete provider paths and deployment identifiers belong to runtime configuration, not committed catalog data.
    evidence: Reference configured state
  - id: rotation-policy-required
    decision: block
    requirement: Every runtime reference must declare a rotation policy before live use.
    evidence: Rotation policy
