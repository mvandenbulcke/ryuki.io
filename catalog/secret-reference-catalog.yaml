# Secret-reference schema seed only. Do not add secret values, concrete
# provider paths, credentials, tokens, real tenant/deployment/object ids,
# private keys, live endpoints, or provider payloads. Field-name lists below
# describe runtime schemas; they are not deployment instances.
version: 2
status: draft
providerModel: capability-registry
managementInterface: provider-adapter
fallbackPolicy: disabled
schemaBoundary: governance-runtime-lease-material-provider-descriptor-provider-lifecycle-publication-materialization
admittedProviderClasses:
  - lease-capable-secret-service
  - cloud-secret-manager
  - deployment-injection
  - enterprise-plugin-adapter
  - development-adapter
capabilityInterfaces:
  - resolve-read
  - issue-dynamic-credential
  - control-lease
  - custody-key
  - issue-certificate
  - publish-version
  - materialize-reload
referencePurpose: Governance records own approval, consumer, rotation, and readiness metadata while runtime SecretRef handles identify one approved provider/version and opaque selector without storing secret material.
referenceKinds:
  - adapter-credential
  - worker-credential
  - database-credential
  - object-storage-credential
  - pki-material
  - recovery-material
  - signing-material
requiredReferenceFields:
  - schemaVersion
  - referenceId
  - providerId
  - providerConfigVersion
  - deploymentId
  - trustDomainId
  - kind
  - purpose
  - scope
  - ownerRole
  - consumerComponent
  - versionSelector
  - rotationPolicy
  - readinessState
  - evidenceRequirement
requiredReferenceFieldsMeaning: Compatibility projection exactly equal to schemaContracts.secretReferenceRecord.requiredFields; the schema contract is canonical and this list is not the runtime SecretRef wire schema.
schemaContracts:
  secretReferenceRecord:
    purpose: Governed administrative record; serializable and value-free.
    requiredFields:
      - schemaVersion
      - referenceId
      - providerId
      - providerConfigVersion
      - deploymentId
      - trustDomainId
      - kind
      - purpose
      - scope
      - ownerRole
      - consumerComponent
      - versionSelector
      - rotationPolicy
      - readinessState
      - evidenceRequirement
    optionalFields:
      - tenantId
  runtimeSecretRef:
    purpose: Scope-bound runtime selection handle; serializable and value-free.
    requiredFields:
      - schemaVersion
      - providerId
      - providerConfigVersion
      - deploymentId
      - trustDomainId
      - referenceFingerprint
      - fingerprintKeyId
      - opaqueLocator
      - purpose
      - versionSelector
    optionalFields:
      - tenantId
      - fieldSelector
  secretLeaseMetadata:
    purpose: Runtime lease and fencing metadata; serializable and value-free.
    requiredFields:
      - schemaVersion
      - referenceFingerprint
      - fingerprintKeyId
      - providerId
      - providerConfigVersion
      - adapterCapabilityVersion
      - deploymentId
      - trustDomainId
      - workloadId
      - purpose
      - authorityEpoch
      - fencingToken
      - lifecycleState
    optionalFields:
      - tenantId
      - requestId
      - jobId
      - leaseId
      - resolvedVersion
      - issuedAt
      - expiresAt
      - terminalAt
    stateRequirements:
      allStates:
        oneOfRequiredFields:
          - requestId
          - jobId
      requested:
        mustBeAbsentFields:
          - leaseId
          - resolvedVersion
          - issuedAt
          - expiresAt
          - terminalAt
      issued:
        requiredFields:
          - leaseId
          - resolvedVersion
          - issuedAt
          - expiresAt
      active:
        requiredFields:
          - leaseId
          - resolvedVersion
          - issuedAt
          - expiresAt
      renewing:
        requiredFields:
          - leaseId
          - resolvedVersion
          - issuedAt
          - expiresAt
      draining:
        requiredFields:
          - leaseId
          - resolvedVersion
          - issuedAt
          - expiresAt
      revoked:
        requiredFields:
          - leaseId
          - resolvedVersion
          - issuedAt
          - expiresAt
          - terminalAt
      expired:
        requiredFields:
          - leaseId
          - resolvedVersion
          - issuedAt
          - expiresAt
          - terminalAt
      failed:
        requiredFields:
          - terminalAt
  secretMaterial:
    purpose: Scope-bound zeroizing bytes; never serializable, debuggable, logged, cached generally, exported, or placed in evidence.
  providerCapabilityDescriptor:
    purpose: Immutable declaration of one admitted adapter version and only the capabilities it has proven.
    requiredFields:
      - schemaVersion
      - providerId
      - providerConfigVersion
      - adapterArtifactDigest
      - adapterVersion
      - adapterProtocolVersion
      - capabilityDescriptorVersion
      - interfaceSemanticVersions
      - limitations
      - allowedProfiles
      - trustDomainId
      - capabilityInterfaces
      - conformanceEvidenceDigest
  providerLifecycleRecord:
    purpose: Separately versioned mutable lifecycle state for one immutable provider configuration; it cannot alter configuration or capability claims.
    requiredFields:
      - schemaVersion
      - providerId
      - providerConfigVersion
      - lifecycleRecordVersion
      - lifecycleState
      - effectiveAt
      - transitionReceiptDigest
    optionalFields:
      - supersedesLifecycleRecordVersion
  publicationReceipt:
    purpose: Value-free acknowledgement of one authorized compare-and-set publication; it never contains source or destination material.
    requiredFields:
      - schemaVersion
      - referenceFingerprint
      - fingerprintKeyId
      - providerId
      - providerConfigVersion
      - capabilityDescriptorVersion
      - deploymentId
      - trustDomainId
      - publisherWorkloadId
      - purpose
      - expectedSourceVersion
      - expectedDestinationVersion
      - publishedVersion
      - idempotencyId
      - authorizationPermitDigest
      - outcome
      - occurredAt
    optionalFields:
      - tenantId
      - requestId
      - jobId
  materializationReceipt:
    purpose: Value-free acknowledgement that one admitted materializer projected an exact reference version to a typed workload destination.
    requiredFields:
      - schemaVersion
      - referenceFingerprint
      - fingerprintKeyId
      - providerId
      - providerConfigVersion
      - capabilityDescriptorVersion
      - deploymentId
      - trustDomainId
      - workloadId
      - destinationKind
      - materializedVersion
      - freshnessObservedAt
      - consumerAcknowledgement
      - lifecycleState
    optionalFields:
      - tenantId
      - requestId
      - jobId
providerDescriptorRequiredFields:
  - schemaVersion
  - providerId
  - providerConfigVersion
  - adapterArtifactDigest
  - adapterVersion
  - adapterProtocolVersion
  - capabilityDescriptorVersion
  - interfaceSemanticVersions
  - limitations
  - allowedProfiles
  - trustDomainId
  - capabilityInterfaces
  - conformanceEvidenceDigest
providerDescriptorRequiredFieldsMeaning: Compatibility projection exactly equal to schemaContracts.providerCapabilityDescriptor.requiredFields; the schema contract is canonical.
versionSelectors:
  - pinned
  - latest-at-resolve
readinessStates:
  - missing
  - pending-approval
  - configured
  - admitted
  - rotation-due
  - blocked
  - quarantined
  - retired
readinessStatesMeaning: Compatibility projection exactly equal to stateModels.referenceReadiness; the named state model is canonical.
stateModels:
  referenceReadiness:
    - missing
    - pending-approval
    - configured
    - admitted
    - rotation-due
    - blocked
    - quarantined
    - retired
  providerLifecycle:
    - configured
    - validated
    - active
    - draining
    - quarantined
    - removed
  leaseLifecycle:
    - requested
    - issued
    - active
    - renewing
    - draining
    - revoked
    - expired
    - failed
allowedConsumers:
  - platform-api
  - platform-worker
  - inventory-sync
  - evidence-service
  - vmware-adapter
  - hyperv-adapter
  - proxmox-adapter
  - veeam-br-adapter
  - veeam-one-adapter
  - zabbix-adapter
  - servicenow-adapter
  - image-factory-controller
  - secret-materialization-controller
rotationPolicies:
  - deployment-managed
  - scheduled-rotation
  - emergency-rotation
  - certificate-renewal
  - manual-break-glass-review
prohibitedFields:
  - value
  - password
  - token
  - clientSecret
  - privateKey
  - tenantId
  - objectId
  - subscriptionId
  - endpoint
  - url
prohibitedFieldsScope: committed-seed-instance-keys-only
prohibitedFieldsMeaning: Compatibility validator projection scoped only to committed seed-instance keys; it is not a ban on tenantId in runtime schema field-name lists, and concrete tenant identifiers remain deployment data.
evidenceRequirements:
  - Reference configured state
  - Rotation policy
  - Consumer component
  - Approval decisions
  - Redacted evidence references
rules:
  - id: capability-registry-required
    decision: block
    requirement: Runtime references must select one admitted provider and immutable configuration version through the capability registry.
    evidence: Reference configured state
  - id: provider-fallbacks-disabled
    decision: block
    requirement: Secret-reference records must not define ordered, legacy, future, or error-triggered provider fallbacks.
    evidence: Approval decisions
  - id: provider-capabilities-admitted
    decision: block
    requirement: Resolution, dynamic issuance, lease control, key custody, certificate issuance, publication, and materialization are independently admitted capabilities.
    evidence: Reference configured state
  - id: schema-boundaries-separated
    decision: block
    requirement: SecretReferenceRecord, runtime SecretRef, SecretLeaseMetadata, SecretMaterial, provider capability descriptors, provider lifecycle records, publication receipts, and materialization receipts must not substitute for one another.
    evidence: Reference configured state
  - id: lease-state-fields-conditional
    decision: block
    requirement: Requested lease metadata has no fabricated lease/version/timing fields; issued, active, renewing, draining, revoked, and expired states carry the lifecycle-specific version and timing fields required by schemaContracts.secretLeaseMetadata.stateRequirements.
    evidence: Reference configured state
  - id: no-secret-values-in-reference
    decision: block
    requirement: Reference records must never contain the resolved secret value or raw credential material.
    evidence: Redacted evidence references
  - id: deployment-paths-outside-catalog
    decision: block
    requirement: Runtime schemas require deployment identity and may require tenant identity, but concrete identifier values and provider paths belong to deployment state and must not appear in committed seed instances.
    evidence: Reference configured state
  - id: rotation-policy-required
    decision: block
    requirement: Every governed SecretReferenceRecord must bind an admitted rotation policy before live use; runtime SecretRef handles bind the admitted record fingerprint and do not duplicate governance policy fields.
    evidence: Rotation policy
  - id: rotation-due-is-policy-state
    decision: block
    requirement: Rotation-due blocks new work only when policy requires; it never fabricates staleness or invalidates an otherwise current lease without an explicit policy or revocation transition.
    evidence: Rotation policy
