# git-cliff configuration — conventional-commit changelog generation.
#
# Generate / refresh CHANGELOG.md from the git history with:
#   git-cliff --config cliff.toml --output CHANGELOG.md
# Render only the section for an unreleased tag (used by the release workflow):
#   git-cliff --config cliff.toml --unreleased --tag "$TAG" --strip all
#
# Conventional Commits reference: https://www.conventionalcommits.org
# git-cliff reference:            https://git-cliff.org/docs/configuration

[changelog]
# Header rendered once at the top of CHANGELOG.md.
header = """
# Changelog

All notable changes to this project are documented here.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
Entries are generated from [Conventional Commits](https://www.conventionalcommits.org)
by [git-cliff](https://git-cliff.org); run `git-cliff --output CHANGELOG.md` to regenerate.
\n
"""
# Per-release body template (Tera syntax).
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
# Footer rendered once at the bottom.
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
# Parse commit messages as Conventional Commits.
conventional_commits = true
# Keep non-conventional commits out of the changelog.
filter_unconventional = true
# Do not split a commit body into multiple changelog entries.
split_commits = false
# Map commit prefixes to changelog groups; ordering controls section order.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^doc", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Testing" },
  { message = "^ci", group = "<!-- 6 -->CI/CD" },
  { message = "^build", group = "<!-- 6 -->CI/CD" },
  { message = "^chore\\(release\\):", skip = true },
  { message = "^chore", group = "<!-- 7 -->Miscellaneous" },
  { body = ".*security", group = "<!-- 8 -->Security" },
  { message = "^revert", group = "<!-- 9 -->Reverted" },
]
# Protect against accidental garbage commits between tags.
protect_breaking_commits = false
filter_commits = false
# Process tags shaped like v1.2.3 only.
tag_pattern = "v[0-9]*"
# Sort commits inside each group oldest-first.
sort_commits = "oldest"
