[workspace]
resolver = "3"
members = [
    "sources/ryuki-core",
    "sources/ryuki-api",
    "sources/ryuki-engine",
    "sources/ryuki-runner",
    "sources/ryuki-protocol",
    "sources/ryuki-agent",
    "portal/portal-ui",
    "scripts/validator-rs",
]

[package]
name = "ryuki-integration-tests"
version = "0.1.0"
edition = "2024"
autobins = false
autolib = false

[[test]]
name = "integration_test"
path = "tests/integration_test.rs"

[[test]]
name = "workspace_integration_test"
path = "tests/workspace_integration_test.rs"

[[test]]
name = "compose_integration_test"
path = "tests/compose_integration_test.rs"

[[test]]
name = "kubernetes_integration_test"
path = "tests/kubernetes_integration_test.rs"

[[test]]
name = "ci_integration_test"
path = "tests/ci_integration_test.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
ryuki-core = { workspace = true }
ryuki-engine = { workspace = true }

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# `raw_value` (additive: adds `RawValue`, does not change number/Value behavior) lets the
# live-plan digest canonicalizer strip terraform's non-deterministic top-level `timestamp`
# WITHOUT reparsing numbers (which could collapse high-precision values and weaken the
# plan-integrity gate). See ryuki-runner/src/live.rs::canonicalize_plan_json.
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit"] }
figment = { version = "0.10", features = ["env", "json", "toml"] }
governor = { version = "0.7", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["limit"] }
hmac = "0.12"
sha2 = "0.10"
jsonschema = { version = "=0.47.0", default-features = false }
url = "2"
ryuki-core = { path = "sources/ryuki-core" }
ryuki-engine = { path = "sources/ryuki-engine" }
ryuki-runner = { path = "sources/ryuki-runner" }
ryuki-protocol = { path = "sources/ryuki-protocol" }
ryuki-agent = { path = "sources/ryuki-agent" }

[profile.wasm-release]
codegen-units = 1
inherits = "release"
lto = true
opt-level = "z"
