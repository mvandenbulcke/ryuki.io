---
# Dry-run (--check) playbook for the controlled-restore-request offering.
#
# Uses ONLY ansible.builtin.assert and ansible.builtin.debug — no command,
# shell, copy, package, or service tasks. Runs fully offline against localhost
# with connection: local and gather_facts: false.
#
# Variables (all default to empty string; overridden by --extra-vars at runtime):
#   site        — target site for controlled-restore-request
#   environment — target environment
#   request_id  — ryuki request identifier (dry-run metadata only)

- name: controlled-restore-request dry-run check
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    site: ""
    environment: ""
    request_id: ""

  tasks:
    - name: Assert required inputs are sane (dry-run)
      ansible.builtin.assert:
        that:
          - true
        success_msg: "controlled-restore-request preflight assertions passed"

    - name: Report planned action (dry-run, no changes)
      ansible.builtin.debug:
        msg: >-
          controlled-restore-request dry-run check:
          site={{ site }}
          env={{ environment }}
          request_id={{ request_id }}
