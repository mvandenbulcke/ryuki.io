[package]
name = "ryuki-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
ryuki-core = { workspace = true }
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }
# Inbound webhook HMAC-SHA256 verification (#18). All three are already resolved
# in Cargo.lock (transitive) — declaring them direct adds no new supply-chain crate.
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
