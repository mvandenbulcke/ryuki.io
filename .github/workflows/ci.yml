name: CI

# Gates main: build, test, lint, secret scan, validator, and (on push) image builds.
# The Pages deploy (.github/workflows/static.yml) triggers via workflow_run on this
# workflow's success, so broken code never redeploys the live site.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least-privilege default token: every job below only reads the repo (build,
# test, lint, secret scan, validator, and local image builds with no push). No
# job writes to the repo, registry, or pull requests, so the token is read-only
# for all jobs; add a per-job `permissions:` override if that ever changes. The
# Pages deploy lives in a separate workflow and is unaffected.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ryuki_ci
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ryuki_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      # rust-toolchain.toml pins the stable channel with rustfmt + clippy components.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Build workspace
        run: cargo build --workspace
      - name: Test workspace
        run: cargo test --workspace
      - name: Test API against PostgreSQL 18
        timeout-minutes: 30
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: ryuki_ci
          PGUSER: postgres
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "$test_log"' EXIT
          export RYUKI_DATABASE_URL
          RYUKI_DATABASE_URL="$(printf 'postgresql://%s@%s:%s/%s' \
            "$PGUSER" "$PGHOST" "$PGPORT" "$PGDATABASE")"
          cargo test -p ryuki-api -- --test-threads=1 --nocapture \
            2>&1 | tee "$test_log"
          if grep -Eqi 'SKIP: (RYUKI_DATABASE_URL|DB (connect failed|unavailable|not available)|no seeded|seed .* not present|no DEFRA)|RYUKI_DATABASE_URL not set|skipping (DB|database) tests' "$test_log"; then
            echo "::error::A PostgreSQL-backed test skipped instead of asserting its fixture"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --check --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Run secret scan
        run: ./scripts/no-secret-scan.sh

  validate:
    name: Validator
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
      - name: Run validator
        run: cargo run --manifest-path scripts/validator-rs/Cargo.toml -- run-all --root .

  images:
    name: Build Images
    runs-on: ubuntu-latest
    # Image builds are heavy; run them on pushes to main only (not PRs) for latency.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build platform-api image
        run: docker build -t ryuki/platform-api:ci -f sources/ryuki-api/Dockerfile .
      - name: Build portal-ui image
        run: docker build -t ryuki/portal-ui:ci -f portal/portal-ui/Dockerfile .
