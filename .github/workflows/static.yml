name: Deploy static content to Pages

# Gated on CI: this deploy only runs after the "CI" workflow (.github/workflows/ci.yml)
# completes successfully on main. Direct pushes to main still land in git as before;
# the live Pages site only redeploys on a green CI run.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Deploy exactly the tree CI validated, not whatever main moved to
          # since. Manual dispatch falls back to the current ref.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # docs/ doubles as the repo's internal documentation tree (design notes,
      # workflow specs, runbooks) that the validator depends on in place.
      # Only the curated site files below are published; everything else in
      # docs/ stays repo-internal. Generated pages land as docs/*.html, so new
      # md2docs.py pages are picked up automatically.
      - name: Stage public site files
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp docs/*.html docs/CNAME docs/favicon.ico _site/
          cp docs/robots.txt docs/sitemap.xml docs/search-index.json _site/
          # Machine-readable public OpenAPI spec, linked from the API reference hub.
          cp docs/openapi.json _site/
          cp -R docs/assets _site/assets
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
